[package]
name = "cargo-faster"
description = "Find out why your Rust build is slow and how to make it faster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://github.com/talaagent/cargo-faster/blob/main/docs/cargo-faster.md"
keywords = ["compile-times", "build-time", "performance", "profiling", "cargo-subcommand"]
categories = ["development-tools::cargo-plugins", "development-tools::profiling"]
# The tests and the fixtures they read, so `cargo test` works from the
# .crate. Not tests/guide_anchors.rs: it checks docs/ at the repository root.
include = [
    "src/**/*.rs",
    "build.rs",
    "tests/cli.rs",
    "tests/profile_integration.rs",
    "tests/timings_cli.rs",
    "tests/fixtures/**",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
]

[[bin]]
name = "cargo-faster"
path = "src/main.rs"

[dependencies]
bpaf.workspace = true
bpaf-kit.workspace = true
guppy.workspace = true
cargo-timings-parse.workspace = true
nextest-libtest-json.workspace = true
rustc-self-profile.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
shlex.workspace = true
syn.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[build-dependencies]
bpaf-kit-build.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
