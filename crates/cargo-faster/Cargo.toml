[package]
name = "cargo-faster"
description = "Find out why your Rust build is slow and how to make it faster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://github.com/talaagent/cargo-faster/blob/main/docs/cargo-faster.md"
keywords = ["compile-times", "build-time", "performance", "profiling", "cargo-subcommand"]
categories = ["development-tools::cargo-plugins", "development-tools::profiling"]
include = ["src/**/*.rs", "build.rs", "tests/**", "README.md", "LICENSE", "NOTICE"]

[[bin]]
name = "cargo-faster"
path = "src/main.rs"

[dependencies]
analyzeme.workspace = true
bpaf.workspace = true
bpaf-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[build-dependencies]
bpaf-kit-build.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
