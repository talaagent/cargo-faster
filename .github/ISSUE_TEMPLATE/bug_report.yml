name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: "Remove secrets from command lines, environment variables and logs. Report vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: reproduction
    attributes:
      label: What you ran
      description: The `cargo faster` command line, and if you can, a small project or the `--json` output that shows the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the full output or error and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: "`cargo faster --version`, `rustc -vV`, your OS, and any RUSTC_WRAPPER (sccache, kache) or linker you use."
    validations:
      required: true
